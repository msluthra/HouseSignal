services:
  streamlit:
    build: .
    command: streamlit run app/Home.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: housesignal
      POSTGRES_USER: housesignal
      POSTGRES_PASSWORD: housesignal_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
